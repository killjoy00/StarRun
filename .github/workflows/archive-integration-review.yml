name: Silent Archive cross-ship real-campaign review

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: archive-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret_route:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'review/silent-archive-')
    name: Archive / ${{ matrix.ship }} / ${{ matrix.difficulty }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {ship: vanguard, difficulty: normal, hangar: max}
          - {ship: kestrel, difficulty: normal, hangar: max}
          - {ship: bulwark, difficulty: normal, hangar: max}
          - {ship: wraith, difficulty: normal, hangar: max}
          - {ship: arcwing, difficulty: normal, hangar: max}
          - {ship: haven, difficulty: normal, hangar: max}
          - {ship: arcwing, difficulty: hard, hangar: max}
          - {ship: wraith, difficulty: hard, hangar: max}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot
        run: tools/install-godot.sh
      - name: Import project
        run: godot --headless --path . --editor --import --quit
      - name: Run two natural multi-world campaigns with real Archive route
        shell: bash
        env:
          SHIP: ${{ matrix.ship }}
          DIFFICULTY: ${{ matrix.difficulty }}
          HANGAR: ${{ matrix.hangar }}
        run: |
          set -euo pipefail
          mkdir -p review
          for offset in 1 2; do
            godot --headless --path . --script tests/archive_campaign.gd -- \
              --ship="$SHIP" --pilot=rookie --difficulty="$DIFFICULTY" \
              --hangar="$HANGAR" --seed-offset="$offset" --matched \
              2>&1 | tee "review/archive-$offset.log"
            if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:|GDScript backtrace' "review/archive-$offset.log"; then
              echo "::error::Archive runtime error at offset $offset"
              exit 1
            fi
          done
          python3 - <<'PY' | tee review/summary.md
          import json,glob
          rows=[]
          for path in sorted(glob.glob("review/archive-*.log")):
              matches=[json.loads(line.split("ARCHIVE_TRIAL ",1)[1]) for line in open(path) if line.startswith("ARCHIVE_TRIAL ")]
              assert len(matches)==1, f"Expected exactly one trial in {path}, got {len(matches)}"
              rows+=matches
          assert all(not r.get("economy_ok",True) is False for r in rows), "Archive affected baseline Core/XP economy"
          assert all(not r.get("eligible",False) or r.get("signals",0)>=2 for r in rows), "Secret route opened without enough recovered signals"
          print("## Real Silent Archive cross-ship audit")
          print("Both runs per fixture use natural World 1-4 combat, ordinary drafts, seeded courier/cast choices, and then true fifth-sector combat when eligible.")
          print("| Ship | Difficulty | Seed | Recovered signals | Reached gate | Beat Custodian | Boss seconds | Control win | XP/Core unchanged |")
          print("|---|---|---:|---:|---|---|---:|---|---|")
          for r in rows:
              control=r.get("control",{})
              boss_s=float(r.get("boss_seconds",-1.0))
              print(f"| {r['ship']} | {r['difficulty']} | {r['seed']} | {r.get('signals',0)} | {r.get('eligible',False)} | {r.get('won',False)} | {boss_s:.1f} | {control.get('won','n/a')} | {r.get('economy_ok','n/a')} |")
          print("\nA bot failure to reach World 4 does not prove a player cannot access the secret. The review's aim is broad progression and runtime coverage.")
          PY
          cat review/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve full stage / signal / boss receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-audit-${{ matrix.ship }}-${{ matrix.difficulty }}
          path: review/
          retention-days: 21
          if-no-files-found: ignore
