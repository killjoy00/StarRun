name: Silent Archive cross-ship real-campaign review

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: archive-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret_route:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'review/silent-archive-') || startsWith(github.head_ref, 'balance/harder-silent-archive-')
    name: Archive / ${{ matrix.ship }} / ${{ matrix.difficulty }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        ship: [vanguard, kestrel, bulwark, wraith, arcwing, haven, lancer]
        difficulty: [normal, hard, insane]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot
        run: tools/install-godot.sh
      - name: Import project
        run: godot --headless --path . --editor --import --quit
      - name: Run four natural campaigns with current Archive and per-loadout fixture
        shell: bash
        env:
          SHIP: ${{ matrix.ship }}
          DIFFICULTY: ${{ matrix.difficulty }}
          HANGAR: max
        run: |
          set -euo pipefail
          mkdir -p review
          failed=0
          for offset in 1 2 3 4; do
            if ! godot --headless --path . --script tests/archive_campaign.gd -- \
              --ship="$SHIP" --pilot=rookie --difficulty="$DIFFICULTY" \
              --hangar="$HANGAR" --seed-offset="$offset" --matched --expedition \
              2>&1 | tee "review/archive-$offset.log"; then
              echo "::error::Archive trial failed at offset $offset"
              failed=1
            fi
            if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:|GDScript backtrace' "review/archive-$offset.log"; then
              echo "::error::Archive runtime error at offset $offset"
              failed=1
            fi
          done
          python3 - <<'PY' | tee review/summary.md
          import json,glob
          rows=[]
          for path in sorted(glob.glob("review/archive-*.log")):
              matches=[json.loads(line.split("ARCHIVE_TRIAL ",1)[1]) for line in open(path) if line.startswith("ARCHIVE_TRIAL ")]
              assert len(matches)==1, f"Expected exactly one trial in {path}, got {len(matches)}"
              rows+=matches
          assert len(rows)==4, "Missing natural campaign receipts"
          assert all(r.get("fixture_ok") is True and not r.get("fault") for r in rows), "Redesigned Archive loadout fixture or campaign failed"
          assert all(not r.get("eligible") or (r.get("archive_version",0)>=4 and r.get("economy_ok") is True and not r.get("timeout") and r.get("control",{}).get("archive_version",0)>=4 and r.get("control",{}).get("economy_ok") is True and not r.get("control",{}).get("timeout")) for r in rows), "Actual qualifying branch did not exercise the current Archive cleanly"
          assert all(not r.get("won") or r.get("remaining_emitters")==0 for r in rows), "Custodian won with an intact emitter"
          assert all(not r.get("eligible",False) or r.get("signals",0)>=2 for r in rows), "Secret route opened without enough recovered signals"
          print("## Real Silent Archive cross-ship audit")
          print("Four natural campaigns per loadout with current expedition rules; matched late-counter and cooldown-only Archive fights from actual qualified gates. The separate phase/restore fixture covers the redesigned boss even where a natural gate is not reached.")
          print("| Ship | Difficulty | Seed | Recovered signals | Reached gate | Beat Custodian | Boss seconds | Control win | XP/Core unchanged |")
          print("|---|---|---:|---:|---|---|---:|---|---|")
          for r in rows:
              control=r.get("control",{})
              boss_s=float(r.get("boss_seconds",-1.0))
              print(f"| {r['ship']} | {r['difficulty']} | {r['seed']} | {r.get('signals',0)} | {r.get('eligible',False)} | {r.get('won',False)} | {boss_s:.1f} | {control.get('won','n/a')} | {r.get('economy_ok','n/a')} |")
          print("\nNatural qualifying gates:",sum(bool(r.get("eligible")) for r in rows),"/",len(rows))
          print("Phase/restore fixtures passed:",sum(bool(r.get("fixture_ok")) for r in rows),"/",len(rows))
          print("A bot failure to reach the gate is reported, not counted as a real Archive fight or a player win rate.")
          PY
          cat review/summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"
      - name: Preserve full stage / signal / boss receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-audit-${{ matrix.ship }}-${{ matrix.difficulty }}
          path: review/
          retention-days: 21
          if-no-files-found: ignore
