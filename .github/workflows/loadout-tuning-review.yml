name: StarRun 1.3 — targeted ship and pilot retest
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: starrun-identity-tuning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'codex/starrun-13-ship-pilot-')
    name: ${{ matrix.ship }} / ${{ matrix.difficulty }} / ${{ matrix.hangar }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - {ship: bulwark, difficulty: hard, hangar: max, limit: 1, seeds: 3, offset: 18}
          - {ship: haven, difficulty: hard, hangar: max, limit: 1, seeds: 3, offset: 18}
          - {ship: bulwark, difficulty: normal, hangar: mid, limit: 2, seeds: 2, offset: 4}
          - {ship: haven, difficulty: normal, hangar: mid, limit: 2, seeds: 2, offset: 4}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Godot
        run: tools/install-godot.sh
      - name: Match every pilot on baseline and tuned loadout mechanics
        shell: bash
        run: |
          set -euo pipefail
          BASELINE="$RUNNER_TEMP/starrun-elite-before-loadout-tuning"
          # This immutable PR commit includes the same elite combat rules
          # but none of the later Bulwark/Haven/Engineer trait tuning.
          git worktree add --detach "$BASELINE" cf17a7d5c5de72a31f0d62cb848b815bd22b730d
          mkdir -p review
          for pilot in rookie ace engineer hunter scavenger tactician; do
            for version in base new; do
              root="$GITHUB_WORKSPACE"
              if [[ "$version" == "base" ]]; then root="$BASELINE"; fi
              godot --headless --path "$root" --editor --import --quit
              log="$GITHUB_WORKSPACE/review/$version-$pilot.log"
              godot --headless --path "$root" --script "$root/tests/balance_matrix.gd" -- \
                --ship=${{ matrix.ship }} --pilot="$pilot" --difficulty=${{ matrix.difficulty }} \
                --hangar=${{ matrix.hangar }} --build=focused --strategy=timed --route=adaptive \
                --stage-limit=${{ matrix.limit }} --seeds=${{ matrix.seeds }} --seed-offset=${{ matrix.offset }} \
                2>&1 | tee "$log"
              if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|GDScript backtrace' "$log"; then
                echo "::error::Godot reported a script or runtime error"
                exit 1
              fi
            done
          done
          python3 tools/report_identity_tuning.py \
            ${{ matrix.ship }} ${{ matrix.difficulty }} ${{ matrix.hangar }} ${{ matrix.seeds }} review/summary.md
          cat review/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve baseline-versus-tuned receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loadout-tuning-${{ matrix.ship }}-${{ matrix.difficulty }}
          path: review/
          retention-days: 30
          if-no-files-found: ignore

  # Complete the equal-Hangar six-ship/six-pilot grid on Insane.
  # Like the Normal/Hard audit this is deterministic bot evidence, not a player win rate.
  insane_grid:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'codex/starrun-13-ship-pilot-')
    name: Insane / ${{ matrix.ship }} / equal max Hangar
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        ship: [vanguard, kestrel, bulwark, wraith, arcwing, haven]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot
        run: tools/install-godot.sh
      - name: Simulate six pilots with identical Hangar and starting seeds
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --import --quit
          mkdir -p review
          for pilot in rookie ace engineer hunter scavenger tactician; do
            echo "::group::${{ matrix.ship }} / insane / $pilot"
            godot --headless --path . --script tests/balance_matrix.gd -- \
              --seeds=2 --seed-offset=4 \
              --ship=${{ matrix.ship }} --pilot="$pilot" \
              --difficulty=insane --hangar=max --build=focused \
              --strategy=timed --route=adaptive --stage-limit=2 --trace \
              2>&1 | tee "review/$pilot.log"
            if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|GDScript backtrace' "review/$pilot.log"; then
              echo "::error::Godot reported a runtime script failure"
              exit 1
            fi
            echo "::endgroup::"
          done
          python3 tools/report_ship_pilot_grid.py \
            ${{ matrix.ship }} insane max review/summary.md
          cat review/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve per-pilot Insane combat receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: insane-ship-pilot-${{ matrix.ship }}
          path: review/
          retention-days: 30
          if-no-files-found: ignore

  # The first Insane grid found Haven dying before the first boss in 9/12
  # cases. Compare the new support-pod/Repair-Drone tuning causally against
  # the immutable exact-seed previous PR head with the same elite rules.
  haven_insane_ab:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'codex/starrun-13-ship-pilot-')
    name: Haven before/after / ${{ matrix.difficulty }} / ${{ matrix.hangar }} / seed-offset-${{ matrix.offset }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - {difficulty: insane, hangar: max, seeds: 2, offset: 4}
          - {difficulty: normal, hangar: mid, seeds: 2, offset: 4}
          # Independent seeds check whether the small Normal regression generalizes.
          - {difficulty: normal, hangar: mid, seeds: 4, offset: 24}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Godot
        run: tools/install-godot.sh
      - name: Replay all Haven pilots on identical baseline and tuned seeds
        shell: bash
        run: |
          set -euo pipefail
          BASELINE="$RUNNER_TEMP/starrun-before-haven-support-buff"
          git worktree add --detach "$BASELINE" 96c79f3f28b283067732b728f98d8036bc0b6220
          mkdir -p review
          for pilot in rookie ace engineer hunter scavenger tactician; do
            for version in base new; do
              root="$GITHUB_WORKSPACE"
              if [[ "$version" == "base" ]]; then root="$BASELINE"; fi
              godot --headless --path "$root" --editor --import --quit
              log="$GITHUB_WORKSPACE/review/$version-$pilot.log"
              godot --headless --path "$root" --script "$root/tests/balance_matrix.gd" -- \
                --ship=haven --pilot="$pilot" --difficulty=${{ matrix.difficulty }} \
                --hangar=${{ matrix.hangar }} --build=focused --strategy=timed --route=adaptive \
                --stage-limit=2 --seeds=${{ matrix.seeds }} --seed-offset=${{ matrix.offset }} \
                2>&1 | tee "$log"
              if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|GDScript backtrace' "$log"; then
                echo "::error::Godot reported a script or runtime error"
                exit 1
              fi
            done
          done
          python3 tools/report_identity_tuning.py \
            haven ${{ matrix.difficulty }} ${{ matrix.hangar }} ${{ matrix.seeds }} review/summary.md
          cat review/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve Haven support-buff paired results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haven-support-ab-${{ matrix.difficulty }}-${{ matrix.offset }}
          path: review/
          retention-days: 30
          if-no-files-found: ignore
