name: StarRun 1.3 — six ships × six pilots balance audit
# The original 72-cell Normal/Hard audit finished as Actions run #44148947874.
# The manual rerun matrix now also includes six Insane/max cells (108 in total).
# Preserve it for manual reruns without launching 144 two-world bot
# campaigns on every later PR or documentation commit.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: starrun-ship-pilot-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch'
    name: ${{ matrix.ship }} / ${{ matrix.difficulty }} / ${{ matrix.hangar }} Hangar
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - {ship: vanguard, difficulty: normal, hangar: mid}
          - {ship: kestrel, difficulty: normal, hangar: mid}
          - {ship: bulwark, difficulty: normal, hangar: mid}
          - {ship: wraith, difficulty: normal, hangar: mid}
          - {ship: arcwing, difficulty: normal, hangar: mid}
          - {ship: haven, difficulty: normal, hangar: mid}
          - {ship: vanguard, difficulty: hard, hangar: max}
          - {ship: kestrel, difficulty: hard, hangar: max}
          - {ship: bulwark, difficulty: hard, hangar: max}
          - {ship: wraith, difficulty: hard, hangar: max}
          - {ship: arcwing, difficulty: hard, hangar: max}
          - {ship: haven, difficulty: hard, hangar: max}
          - {ship: vanguard, difficulty: insane, hangar: max}
          - {ship: kestrel, difficulty: insane, hangar: max}
          - {ship: bulwark, difficulty: insane, hangar: max}
          - {ship: wraith, difficulty: insane, hangar: max}
          - {ship: arcwing, difficulty: insane, hangar: max}
          - {ship: haven, difficulty: insane, hangar: max}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot
        run: tools/install-godot.sh
      - name: Run all six pilots with equal Hangar and matched starting seeds
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --import --quit
          mkdir -p review
          for pilot in rookie ace engineer hunter scavenger tactician; do
            echo "::group::${{ matrix.ship }} / ${{ matrix.difficulty }} / $pilot"
            godot --headless --path . --script tests/balance_matrix.gd -- \
              --seeds=2 --seed-offset=4 \
              --ship=${{ matrix.ship }} --pilot="$pilot" \
              --difficulty=${{ matrix.difficulty }} --hangar=${{ matrix.hangar }} \
              --build=focused --strategy=timed --route=adaptive --stage-limit=2 --trace \
              2>&1 | tee "review/$pilot.log"
            if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|GDScript backtrace' "review/$pilot.log"; then
              exit 1
            fi
            echo "::endgroup::"
          done
          python3 tools/report_ship_pilot_grid.py \
            ${{ matrix.ship }} ${{ matrix.difficulty }} ${{ matrix.hangar }} review/summary.md
          cat review/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve per-pilot real-combat traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ship-pilot-${{ matrix.ship }}-${{ matrix.difficulty }}
          path: review/
          retention-days: 30
          if-no-files-found: ignore
