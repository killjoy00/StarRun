name: Archive regression smoke
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: archive-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  GATE_BASELINE: 124f825bd01f4c16c7ef1bb9ddf7a978bd17c3b9
jobs:
  scope:
    uses: ./.github/workflows/ci-scope.yml
  fixtures:
    needs: scope
    if: needs.scope.outputs.archive == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: tools/install-godot.sh
      - run: godot --headless --path . --editor --import --quit
      - name: Phase and restore contracts for all 21 loadouts
        run: |
          set -euo pipefail
          godot --headless --path . --script tests/archive_campaign.gd -- --gate-mode=fixtures |& tee fixtures.log
          ! grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:|GDScript backtrace' fixtures.log
          test "$(grep -c '^ARCHIVE_FIXTURE ' fixtures.log)" -eq 21
          python3 - <<'PY'
          import json
          rows=[json.loads(s.split(' ',1)[1]) for s in open('fixtures.log') if s.startswith('ARCHIVE_FIXTURE ')]
          ships={'vanguard','bulwark','haven','arcwing','wraith','kestrel','lancer'}
          assert len(rows)==21 and {(r['ship'],r['difficulty']) for r in rows}=={(s,d) for s in ships for d in ('normal','hard','insane')}
          assert all(r['passed'] is True for r in rows)
          PY
  replay:
    needs: scope
    if: needs.scope.outputs.archive == 'true'
    name: Earned gate / ${{ matrix.ship }} / ${{ matrix.difficulty }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {ship: bulwark, difficulty: insane, offsets: '1 2'}
          - {ship: kestrel, difficulty: insane, offsets: '1 3'}
          - {ship: bulwark, difficulty: normal, offsets: '1 2'}
          - {ship: kestrel, difficulty: hard, offsets: '1 2'}
    env:
      SHIP: ${{ matrix.ship }}
      DIFFICULTY: ${{ matrix.difficulty }}
      OFFSETS: ${{ matrix.offsets }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          persist-credentials: false
      - run: candidate/tools/install-godot.sh
      - uses: actions/cache@v4
        id: gates
        with:
          path: .ci-gates
          key: archive-gates-v1-${{ env.GATE_BASELINE }}-${{ matrix.ship }}-${{ matrix.difficulty }}-${{ hashFiles('candidate/tests/archive_campaign.gd') }}
      - uses: actions/checkout@v4
        if: steps.gates.outputs.cache-hit != 'true'
        with:
          ref: ${{ env.GATE_BASELINE }}
          path: baseline
          persist-credentials: false
      - name: Generate immutable naturally earned gate receipts on cache miss
        if: steps.gates.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p .ci-gates
          cp candidate/tests/archive_campaign.gd baseline/tests/archive_campaign.gd
          cd baseline
          godot --headless --path . --editor --import --quit
          for offset in $OFFSETS; do
            log="$GITHUB_WORKSPACE/.ci-gates/generate-$offset.log"
            godot --headless --path . --script tests/archive_campaign.gd -- --gate-mode=generate --expedition --matched --ship="$SHIP" --pilot=rookie --difficulty="$DIFFICULTY" --hangar=max --seed-offset="$offset" --baseline-sha="$GATE_BASELINE" --gate-file="$GITHUB_WORKSPACE/.ci-gates/gate-$offset.bin" |& tee "$log"
            ! grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:|GDScript backtrace' "$log"
            test "$(grep -c '^ARCHIVE_GATE_SAVED ' "$log")" -eq 1
            test -s "$GITHUB_WORKSPACE/.ci-gates/gate-$offset.bin"
          done
      - name: Replay current boss from those genuine baseline gates
        working-directory: candidate
        run: |
          set -euo pipefail
          mkdir -p review
          godot --headless --path . --editor --import --quit
          for offset in $OFFSETS; do
            log="review/replay-$offset.log"
            godot --headless --path . --script tests/archive_campaign.gd -- --gate-mode=replay --expedition --matched --require-win --ship="$SHIP" --pilot=rookie --difficulty="$DIFFICULTY" --hangar=max --seed-offset="$offset" --baseline-sha="$GATE_BASELINE" --gate-file="$GITHUB_WORKSPACE/.ci-gates/gate-$offset.bin" |& tee "$log"
            ! grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:|GDScript backtrace' "$log"
            test "$(grep -c '^ARCHIVE_TRIAL ' "$log")" -eq 1
          done
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob,json,os
          rows=[json.loads(line.split(' ',1)[1]) for p in glob.glob('review/replay-*.log') for line in open(p) if line.startswith('ARCHIVE_TRIAL ')]
          assert len(rows)==2 and {r['seed'] for r in rows}=={810000+(int(i)+1)*7919 for i in os.environ['OFFSETS'].split()}
          assert all(r['gate_source']=='frozen_baseline' and r['baseline_sha']==os.environ['GATE_BASELINE'] and r['eligible'] and r['signals']>=2 and not r['fault'] and r['fixture_ok'] for r in rows)
          for r in rows:
              for fight in (r,r['control']):
                  assert fight['archive_version']==5 and fight['won'] and not fight['timeout'] and fight['economy_ok'] and fight['remaining_emitters']==0
              print(f"Frozen {r['ship']} {r['difficulty']} seed {r['seed']}: timed {r['boss_seconds']:.1f}s / cooldown {r['control']['boss_seconds']:.1f}s")
          print("Frozen baseline replay, not a new campaign qualification or population win-rate estimate.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archive-smoke-${{ matrix.ship }}-${{ matrix.difficulty }}
          path: |
            candidate/review/
            .ci-gates/generate-*.log
          retention-days: 14
