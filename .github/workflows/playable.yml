name: Playable build
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: playable-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  simulation:
    name: Simulation and checkpoint checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot
        run: tools/install-godot.sh
      - name: Import project
        run: godot --headless --path . --editor --import --quit
      - name: Parse simulation and playfield with strict Godot warnings
        run: |
          godot --headless --path . --check-only --script scripts/simulation.gd
          godot --headless --path . --check-only --script scripts/playfield.gd
          godot --headless --path . --check-only --script tests/balance_matrix.gd
          godot --headless --path . --check-only --script scripts/meta_progress.gd
          godot --headless --path . --check-only --script tests/meta_progress.gd
      - name: Check first scene and reject script parse errors
        run: |
          godot --headless --path . --quit-after 10 2>&1 | tee /tmp/starrun-startup.log
          if grep -Eq "SCRIPT ERROR:|ERROR: Failed to load script" /tmp/starrun-startup.log; then
            echo "::error::Godot reported a script parse failure"
            exit 1
          fi
      - name: Daily Challenge and achievements persistence tests
        run: |
          set -o pipefail
          godot --headless --path . --script tests/meta_progress.gd 2>&1 | tee /tmp/starrun-meta-progress.log
          if grep -Eq "SCRIPT ERROR:|ERROR: Failed to load script" /tmp/starrun-meta-progress.log; then
            echo "::error::Godot reported a run-progression script error"
            exit 1
          fi
      - name: Phone and Steam Deck layout checks
        run: |
          set -o pipefail
          godot --headless --path . --script tests/ui_smoke.gd 2>&1 | tee /tmp/starrun-ui.log
          if grep -Eq "SCRIPT ERROR:|ERROR: Failed to load script" /tmp/starrun-ui.log; then
            echo "::error::Godot reported a runtime script failure during UI tests"
            exit 1
          fi
      - name: Render combat readability and phone upgrade checks
        run: |
          set -o pipefail
          xvfb-run -a godot --path . --audio-driver Dummy --script tests/visual_readability.gd 2>&1 | tee /tmp/starrun-visual.log
          if grep -Eq "SCRIPT ERROR:|ERROR: Failed to load script" /tmp/starrun-visual.log; then
            exit 1
          fi
      - name: Render all fusion insignia and effects
        run: |
          set -o pipefail
          xvfb-run -a godot --path . --audio-driver Dummy --script tests/fusion_visuals.gd 2>&1 | tee /tmp/starrun-fusions.log
          if grep -Eq "SCRIPT ERROR:|ERROR: Failed to load script" /tmp/starrun-fusions.log; then
            exit 1
          fi
      - name: Expanded Hangar and pilot portrait checks
        run: |
          set -o pipefail
          xvfb-run -a godot --path . --audio-driver Dummy --script tests/hangar_expansion_ui.gd 2>&1 | tee /tmp/starrun-expansion.log
          if grep -Eq "SCRIPT ERROR:|ERROR: Failed to load script" /tmp/starrun-expansion.log; then
            exit 1
          fi
      - name: iPhone safe-area and held-card drag checks
        run: |
          set -o pipefail
          xvfb-run -a godot --path . --audio-driver Dummy --script tests/touch_and_safe_area.gd 2>&1 | tee /tmp/starrun-touch.log
          if grep -Eq "SCRIPT ERROR:|ERROR: Failed to load script|Error calling from signal" /tmp/starrun-touch.log; then
            exit 1
          fi
      - name: Capture 21 UI screens at three viewport sizes
        run: |
          set -o pipefail
          xvfb-run -a godot --path . --audio-driver Dummy --script tests/screenshot_harness.gd 2>&1 | tee /tmp/starrun-screenshots.log
          if grep -Eq "SCRIPT ERROR:|ERROR: Failed to load script|Error calling from signal" /tmp/starrun-screenshots.log; then
            exit 1
          fi
      - name: Attach all screen captures to every PR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StarRun-UI-matrix
          path: /tmp/starrun-screenshots
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve combat and upgrade previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StarRun-combat-readability
          path: /tmp/starrun-visuals
          if-no-files-found: ignore
          retention-days: 14
      - name: Replay, fairness, draft, save, and matched-seed balance checks
        run: |
          set -o pipefail
          godot --headless --path . --script tests/run.gd 2>&1 | tee /tmp/starrun-simulation.log
          if grep -Eq "SCRIPT ERROR:|ERROR: Failed to load script" /tmp/starrun-simulation.log; then
            echo "::error::Godot reported a runtime script failure during simulation tests"
            exit 1
          fi
  balance_smoke:
    name: Full campaign / ${{ matrix.ship }} / ${{ matrix.difficulty }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {ship: vanguard, difficulty: normal}
          - {ship: kestrel, difficulty: hard}
          - {ship: bulwark, difficulty: hard}
          - {ship: wraith, difficulty: insane}
          - {ship: arcwing, difficulty: normal}
          - {ship: haven, difficulty: insane}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot
        run: tools/install-godot.sh
      - name: Import project
        run: godot --headless --path . --editor --import --quit
      - name: "Scripted full-campaign smoke: three active-use policies"
        run: |
          set -o pipefail
          godot --headless --path . --script tests/balance_matrix.gd -- \
            --seeds=1 --ship=${{ matrix.ship }} --difficulty=${{ matrix.difficulty }} \
            2>&1 | tee /tmp/starrun-balance-${{ matrix.ship }}-${{ matrix.difficulty }}.log
          if grep -Eq "SCRIPT ERROR:|ERROR: Failed to load script" /tmp/starrun-balance-*.log; then
            echo "::error::Godot reported a balance matrix runtime error"
            exit 1
          fi
      - name: Attach balance matrix diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balance-smoke-${{ matrix.ship }}-${{ matrix.difficulty }}
          path: /tmp/starrun-balance-*.log
          if-no-files-found: ignore
          retention-days: 14
  real_campaign:
    name: Real four-world completion (no forced boss kills)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot
        run: tools/install-godot.sh
      - name: Import project
        run: godot --headless --path . --editor --import --quit
      - name: "Require a genuine four-world victory with offered draft cards"
        run: |
          set -o pipefail
          godot --headless --path . --script tests/balance_matrix.gd -- \
            --seeds=1 --seed-offset=1 --strategy=timed \
            --ship=arcwing --difficulty=normal --build=focused \
            --hangar=mid --pilot=rookie --trace --require-win \
            2>&1 | tee /tmp/starrun-complete-campaign.log
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script' /tmp/starrun-complete-campaign.log; then
            echo "::error::Godot reported an error during full four-world gameplay"
            exit 1
          fi
      - name: Preserve reproducible full-campaign evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StarRun-four-world-victory
          path: /tmp/starrun-complete-campaign.log
          if-no-files-found: ignore
          retention-days: 30
  exports:
    name: Web, Windows, and Linux builds
    needs: simulation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.6.3.stable
          key: godot-4.6.3-starrun-templates-v1
        id: templates
      - name: Install pinned Godot and templates
        run: tools/install-godot.sh ${{ steps.templates.outputs.cache-hit != 'true' && '--templates' || '' }}
      - name: Build all playtest targets
        run: |
          mkdir -p build/web build/windows build/linux
          godot --headless --path . --editor --import --quit
          godot --headless --path . --export-release Web build/web/index.html
          python3 tools/package-web.py build/web
          godot --headless --path . --export-release Windows build/windows/StarRun.exe
          godot --headless --path . --export-release Linux build/linux/StarRun.x86_64
          build/linux/StarRun.x86_64 --headless --quit-after 10
      - uses: actions/upload-artifact@v4
        with:
          name: StarRun-web
          path: build/web
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: StarRun-Windows
          path: build/windows
          retention-days: 30
      - name: Archive Linux executable with its permissions
        run: tar -C build/linux -czf build/StarRun-Linux.tar.gz StarRun.x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: StarRun-Linux
          path: build/StarRun-Linux.tar.gz
          retention-days: 30
