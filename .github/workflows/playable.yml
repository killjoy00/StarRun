name: Playable build
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: playable-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  simulation:
    name: Simulation and checkpoint checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot
        run: tools/install-godot.sh
      - name: Import project
        run: godot --headless --path . --editor --import --quit
      - name: Parse simulation and playfield with strict Godot warnings
        run: |
          godot --headless --path . --check-only --script scripts/simulation.gd
          godot --headless --path . --check-only --script scripts/playfield.gd
      - name: Check first scene and reject script parse errors
        run: |
          godot --headless --path . --quit-after 10 2>&1 | tee /tmp/starrun-startup.log
          if grep -Eq "SCRIPT ERROR:|ERROR: Failed to load script" /tmp/starrun-startup.log; then
            echo "::error::Godot reported a script parse failure"
            exit 1
          fi
      - name: Phone and Steam Deck layout checks
        run: |
          set -o pipefail
          godot --headless --path . --script tests/ui_smoke.gd 2>&1 | tee /tmp/starrun-ui.log
          if grep -Eq "SCRIPT ERROR:|ERROR: Failed to load script" /tmp/starrun-ui.log; then
            echo "::error::Godot reported a runtime script failure during UI tests"
            exit 1
          fi
      - name: Render combat readability and phone upgrade checks
        run: |
          set -o pipefail
          xvfb-run -a godot --path . --audio-driver Dummy --script tests/visual_readability.gd 2>&1 | tee /tmp/starrun-visual.log
          if grep -Eq "SCRIPT ERROR:|ERROR: Failed to load script" /tmp/starrun-visual.log; then
            exit 1
          fi
      - name: Preserve combat and upgrade previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StarRun-combat-readability
          path: /tmp/starrun-visuals
          if-no-files-found: ignore
          retention-days: 14
      - name: Replay, fairness, draft, save, and matched-seed balance checks
        run: |
          set -o pipefail
          godot --headless --path . --script tests/run.gd 2>&1 | tee /tmp/starrun-simulation.log
          if grep -Eq "SCRIPT ERROR:|ERROR: Failed to load script" /tmp/starrun-simulation.log; then
            echo "::error::Godot reported a runtime script failure during simulation tests"
            exit 1
          fi
  exports:
    name: Web, Windows, and Linux builds
    needs: simulation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.6.3.stable
          key: godot-4.6.3-starrun-templates-v1
        id: templates
      - name: Install pinned Godot and templates
        run: tools/install-godot.sh ${{ steps.templates.outputs.cache-hit != 'true' && '--templates' || '' }}
      - name: Build all playtest targets
        run: |
          mkdir -p build/web build/windows build/linux
          godot --headless --path . --editor --import --quit
          godot --headless --path . --export-release Web build/web/index.html
          python3 tools/package-web.py build/web
          godot --headless --path . --export-release Windows build/windows/StarRun.exe
          godot --headless --path . --export-release Linux build/linux/StarRun.x86_64
          build/linux/StarRun.x86_64 --headless --quit-after 10
      - uses: actions/upload-artifact@v4
        with:
          name: StarRun-web
          path: build/web
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: StarRun-Windows
          path: build/windows
          retention-days: 30
      - name: Archive Linux executable with its permissions
        run: tar -C build/linux -czf build/StarRun-Linux.tar.gz StarRun.x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: StarRun-Linux
          path: build/StarRun-Linux.tar.gz
          retention-days: 30
