[preset.0]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="data/*.json"
exclude_filter="tests/*,docs/*,build/*"
export_path="build/web/index.html"

[preset.0.options]
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/custom_html_shell="res://web/shell.html"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false

[preset.1]
name="Linux"
platform="Linux"
runnable=true
export_filter="all_resources"
include_filter="data/*.json"
exclude_filter="tests/*,docs/*,build/*,web/*"
export_path="build/linux/StarRun.x86_64"

[preset.1.options]
binary_format/architecture="x86_64"
binary_format/embed_pck=true

[preset.2]
name="Windows"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="data/*.json"
exclude_filter="tests/*,docs/*,build/*,web/*"
export_path="build/windows/StarRun.exe"

[preset.2.options]
binary_format/architecture="x86_64"
binary_format/embed_pck=true
application/modify_resources=false

[preset.3]
name="iOS"
platform="iOS"
runnable=false
export_filter="all_resources"
include_filter="data/*.json"
exclude_filter="tests/*,docs/*,build/*,web/*"
export_path="build/ios/StarRun.zip"

[preset.3.options]
application/app_store_team_id="3564X3VTDB"
application/bundle_identifier="com.rsm.starrun"
application/short_version="0.3.1"
application/version="1"
application/export_project_only=true
application/targeted_device_family=0
application/min_ios_version="17.0"
architectures/arm64=true
icons/icon_1024x1024="res://assets/ios-icon.png"
icons/app_store_1024x1024="res://assets/ios-icon.png"
